trigger:
  - main
pool:
  vmImage: ubuntu-latest
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
  - script: npm ci
    displayName: Install dependencies
  - task: AzureCLI@2
    inputs:
      azureSubscription: '34fadf61-aa84-47a9-978c-adb4a08c6b2e'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: python3 scripts/deploy.py
    displayName: Test and deploy private package with managed identity
